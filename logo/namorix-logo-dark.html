<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Namorix - The Abstract IX Logo</title>
    
    <meta name="author" content="Nguyen Danh Nam">
    <meta name="copyright" content="Copyright (c) 2026 Nguyen Danh Nam">
    <link rel="license" href="https://creativecommons.org/licenses/by-nc-nd/4.0/">
    
    <link rel="schema.DC" href="http://purl.org/dc/elements/1.1/">
    <meta name="DC.title" content="Namorix Official Logo">
    <meta name="DC.creator" content="Nguyen Danh Nam">
    <meta name="DC.rights" content="Copyright (c) 2026 Nguyen Danh Nam. CC BY-NC-ND 4.0">
    
    <meta property="og:title" content="Namorix - The Abstract IX Logo">
    <meta property="og:description" content="Official Brand Asset for Namorix Ecosystem">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://raw.githubusercontent.com/Namorix/namorix-assets/main/logo/namorix-logo.png">

    <style>
        :root{--b:#007AFF;--d:#1C1C1E;--w:#FFF}
        body{margin:0;display:flex;justify-content:center;align-items:center;height:100vh;background:#f4f4f4;font-family:system-ui,-apple-system,sans-serif}
        .showcase{display:flex;flex-direction:column;align-items:center;gap:20px}
        /* App Icon Container */
        .a{width:240px;height:240px;background:var(--d);border-radius:54px;display:flex;justify-content:center;align-items:center;box-shadow:0 20px 40px rgba(0,0,0,.2);position:relative}
        /* Graphic Elements */
        .w{position:relative;width:140px;height:140px;display:flex;align-items:center;justify-content:center}
        .i{width:22px;height:90px;background:var(--b);border-radius:50px;position:absolute;left:0}
        .x{position:absolute;right:0;width:90px;height:90px}
        .s{width:22px;height:110px;background:var(--w);border-radius:50px;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(45deg)}
        .n{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-45deg);display:flex;flex-direction:column;gap:12px}
        .o{width:18px;height:18px;background:var(--b);border-radius:50%}
        /* Label */
        .l{color:var(--d);font-weight:600;letter-spacing:1px;font-size:18px;margin-top:10px;opacity:.8}
        .c{font-size:12px;color:#888;margin-top:5px}
    </style>
</head>
<body>

    <div class="showcase">
        <div class="a">
            <div class="w">
                <div class="i"></div>
                <div class="x">
                    <div class="s"></div>
                    <div class="n">
                        <div class="o"></div>
                        <div class="o"></div>
                        <div class="o"></div>
                        <div class="o"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="l">NAMORIX</div>
        <div class="c">© 2026 Nguyen Danh Nam • CC BY-NC-ND 4.0</div>
    </div>

</body>
</html>
